# CrickScorer — Docker Compose development environment
#
# Startup order (health-gated):
#   db (healthy) → server (healthy) → admin, viewer
#
# Inter-service networking uses Compose service names (db, server, admin, viewer).
# Do not use localhost for container-to-container communication.
#
# Database: PostgreSQL 18.3 (required). All future entity IDs are UUIDv7
# via native uuidv7() — see docs/architecture/UUIDv7_Entity_IDs.md.

name: crickscorer

services:
  db:
    image: postgres:18.3-alpine
    container_name: crickscorer-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host access for local debugging only; containers use service name `db`.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql (not .../data).
      - crickscorer_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - crickscorer

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: crickscorer-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SQLAlchemy / Alembic (service name `db`; psycopg v3 driver).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "8000"
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      # Source mount for Uvicorn --reload.
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # FastAPI GET /health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - crickscorer

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: crickscorer-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Browser uses relative /api; Vite proxies to FastAPI inside Compose.
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://server:8000
      PORT: "5173"
      HOST: "0.0.0.0"
    ports:
      - "${ADMIN_PORT:-5173}:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - crickscorer

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile.dev
    container_name: crickscorer-viewer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Browser uses relative /api; Vite proxies to FastAPI inside Compose.
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://server:8000
      PORT: "5174"
      HOST: "0.0.0.0"
    ports:
      - "${VIEWER_PORT:-5174}:5174"
    volumes:
      - ./viewer:/app
      - viewer_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5174/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - crickscorer

volumes:
  crickscorer_pgdata:
    name: crickscorer_pgdata
  admin_node_modules:
    name: crickscorer_admin_node_modules
  viewer_node_modules:
    name: crickscorer_viewer_node_modules

networks:
  crickscorer:
    name: crickscorer
    driver: bridge
